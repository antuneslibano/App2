name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Mestre da Mina - build ${{ github.run_number }}" \
            --notes "APK gerado automaticamente via GitHub Actions a partir do commit ${{ github.sha }}." \
            --repo ${{ github.repository }}
